# Dependency updates, deliberately quiet.
#
# openGym is dependency-light on purpose: the frontend is React + Router + Zustand (plus
# Supabase JS for the optional sync), and the test tooling is Vite/Vitest/Playwright. A default
# Dependabot setup would still open a PR per package per week, which on a solo project means the
# alerts stop being read — the opposite of what this is for. So: monthly, everything in an
# ecosystem grouped into a single PR, and a low cap on open PRs. Security advisories are
# unaffected by any of this; GitHub raises those regardless of schedule.
#
# Only manifests that actually exist here are listed — there is no backend, so no api/ or
# Docker entries.
version: 2

updates:
  # Frontend app — frontend/package.json
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      # Routine bumps arrive as one PR. Runtime and build tooling move together anyway (a Vite
      # bump usually wants its plugin bumped), and splitting them doubles the review without
      # splitting the risk.
      frontend:
        patterns: ['*']
        update-types: ['minor', 'patch']
      # Majors get their own PR, so a breaking bump lands alone and reads as the decision it is.
      frontend-major:
        patterns: ['*']
        update-types: ['major']

  # Workflow actions — everything under .github/workflows/
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      # These are all first-party actions/* pinned to a major tag; they update in lockstep and
      # none of them is worth a PR of its own.
      actions:
        patterns: ['*']
        update-types: ['minor', 'patch']
      # Action majors are usually a runner or Node-version change and usually harmless — but
      # these workflows deploy the live demo, so the blast radius is real. Separate PR, so a
      # failure has an obvious cause.
      actions-major:
        patterns: ['*']
        update-types: ['major']
