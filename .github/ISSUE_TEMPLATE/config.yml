blank_issues_enabled: false
contact_links:
  - name: Question, or something that won't behave
    url: https://github.com/soymatta/personal-opengym/issues
    about: Describe what you saw and on which screen — this fork has no login, no server and no coach, so those are never the cause.
  - name: Security report
    url: https://github.com/soymatta/personal-opengym/security/advisories/new
    about: Private channel for anything security-related — please don't open a public issue for it.
  - name: Contributing guide
    url: https://github.com/soymatta/personal-opengym/blob/main/CONTRIBUTING.md
    about: Project layout, dev setup and guidelines before you open a PR.
