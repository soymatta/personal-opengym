name: Bug report
description: Something in openGym is broken or not working as expected
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What did you do?
      description: Steps to reproduce, as precisely as you can.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      description: Include error messages, console output, or screenshots if you have them.
    validations:
      required: true

  - type: dropdown
    id: setup
    attributes:
      label: How are you running openGym?
      options:
        - Deployed static build (Vercel / Pages / static host)
        - Frontend dev server (npm run dev)
        - Installed as a home-screen app (PWA)
        - Other / not sure
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Browser & OS
      placeholder: e.g. Safari 17 on iOS 18, Chrome 126 on Android
    validations:
      required: true

  - type: checkboxes
    id: data
    attributes:
      label: Data-related
      description: >
        openGym keeps everything in this browser's localStorage — there is no server and no
        login. If data went missing, say whether you had an export/backup and whether the
        optional Supabase sync was configured.
      options:
        - label: This is about data not being where I expected it
